# Reference-video research. Downloads every link in research/links.txt on GitHub's runners,
# measures each video (cuts, shot length, motion, a 10 fps motion curve, colours, tempo) and
# makes contact sheets for frame-by-frame review. Results go to the research-results branch.
#
# This repository is public, so frames of other people's videos are never committed in readable
# form: the contact sheets are encrypted to research/research-key.pub.pem, and only the holder
# of the private key can open them. The measurements (numbers only) are committed as plain JSON
# and CSV. Videos themselves are never stored.
name: Research videos

on:
  push:
    branches: [claude/youthful-darwin-n1lt7l]
    paths: [research/links.txt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-videos
  cancel-in-progress: false

env:
  PER_SHARD: 25

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.split.outputs.shards }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: split
        run: |
          n=$(grep -c . research/links.txt)
          count=$(( (n + PER_SHARD - 1) / PER_SHARD ))
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($count))))")" >> "$GITHUB_OUTPUT"
          echo "$n links in $count shards"

  measure:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: motion-kit/package-lock.json

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pipx install yt-dlp || pip install --user -U yt-dlp

      - name: Install
        working-directory: motion-kit
        run: npm ci --no-audit --no-fund

      - name: Download
        run: |
          s=${{ matrix.shard }}
          grep . research/links.txt | sed -n "$(( s * PER_SHARD + 1 )),$(( (s + 1) * PER_SHARD ))p" > "$RUNNER_TEMP/shard.txt"
          bash research/fetch.sh "$RUNNER_TEMP/shard.txt" "$RUNNER_TEMP/videos" "out/failures/s$s.txt" "s$(printf '%02d' "$s")"

      - name: Measure
        run: |
          if ls "$RUNNER_TEMP"/videos/*.mp4 >/dev/null 2>&1; then
            node motion-kit/scripts/research.mjs "$RUNNER_TEMP/videos" --out "$GITHUB_WORKSPACE/out/data/s${{ matrix.shard }}"
          fi

      - name: Contact sheets
        run: bash research/sheets.sh "$RUNNER_TEMP/videos" out/sheets

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore

  publish:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/out

      - name: Assemble
        run: |
          OUT="$RUNNER_TEMP/out"
          PUB="$RUNNER_TEMP/pub"
          mkdir -p "$PUB/data"
          # Measurements: one JSON per video, one combined summary table.
          find "$OUT/data" -name '*.json' -exec cp {} "$PUB/data/" \; 2>/dev/null || true
          first=1
          for f in "$OUT"/data/*/summary.csv; do
            [ -e "$f" ] || continue
            if [ $first = 1 ]; then cat "$f"; first=0; else tail -n +2 "$f"; fi
          done > "$PUB/summary.csv"
          cat "$OUT"/failures/*.txt > "$PUB/failures.txt" 2>/dev/null || : > "$PUB/failures.txt"
          cat "$OUT"/failures/*.log > "$PUB/failures.log" 2>/dev/null || : > "$PUB/failures.log"
          # Contact sheets: AES-256 with a one-off key, the key itself sealed to the research public key.
          if [ -d "$OUT/sheets" ]; then
            key=$(openssl rand -hex 32)
            tar -C "$OUT" -cf - sheets | openssl enc -aes-256-cbc -pbkdf2 -salt -pass "pass:$key" -out "$PUB/sheets.tar.enc"
            printf '%s' "$key" | openssl pkeyutl -encrypt -pubin -inkey research/research-key.pub.pem -pkeyopt rsa_padding_mode:oaep -out "$PUB/sheets.key.enc"
            unset key
            split -b 90m -d "$PUB/sheets.tar.enc" "$PUB/sheets.tar.enc.part"
            rm "$PUB/sheets.tar.enc"
          fi
          {
            echo "# Research results"
            echo
            echo "Generated by .github/workflows/research.yml from research/links.txt at ${GITHUB_SHA}."
            echo
            echo "- summary.csv: one row per video (duration, shots, average shot, motion, tempo, suggested style)"
            echo "- data/*.json: full measurements per video, including a 10 fps motion curve"
            echo "- failures.txt: links that could not be downloaded"
            echo "- sheets.*: encrypted contact sheets (2 frames per second), readable only with the research private key"
          } > "$PUB/README.md"
          echo "videos measured: $(ls "$PUB"/data/*.json 2>/dev/null | wc -l); failed: $(wc -l < "$PUB/failures.txt")"

      - name: Publish to research-results
        run: |
          PUB="$RUNNER_TEMP/pub"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan research-results
          git rm -rq --cached . >/dev/null
          git clean -fdq
          cp -r "$PUB"/. .
          git add -A
          git commit -qm "Research results for ${GITHUB_SHA::7}"
          git push -qf origin research-results
